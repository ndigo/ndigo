id: pascalcase-decorator
language: TypeScript
severity: warning
message: Decorator @$DECORATOR uses PascalCase. BlueJS decorators must be camelCase.
rule:
  kind: decorator
  has:
    regex: ^[A-Z][A-Za-z0-9]*$
    stopBy: end
    pattern: $DECORATOR
files:
  - packages/**/src/**/*.ts
  - apps/**/src/**/*.ts
ignores:
  - '**/*.spec.ts'
  - '**/*.test.ts'
