name: CI

on:
  # PRs run the full lane. Squash merges re-test the exact tree the PR already
  # validated, so the post-merge push run was a near-duplicate — dropping it
  # halves the private-repo Actions burn of the normal PR flow. The weekly
  # main sweep plus manual dispatch keep the safety net (MIN-1, 2026-10-31).
  #
  # Draft PRs are skipped: work-in-progress pushes are the single largest source
  # of wasted minutes (issue #276). `ready_for_review` runs the lane the moment
  # the PR is promoted, so nothing merges unproven.
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only PRs take the light `docs.yml` lane (format + links); the full
    # lane runs only when at least one non-doc file changed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

# Minimal permissions: only read the repository; artifacts need contents read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Nx Cloud is parked until its credit allowance restores (issue #206): no
  # remote cache and no self-healing calls. The quality and e2e jobs persist
  # `.nx` through GitHub Actions instead, which costs no Nx credits.
  # Re-enable by restoring `nxCloudId` in nx.json and the
  # NX_CLOUD_ACCESS_TOKEN secret — leave self-healing (`nx fix-ci`) off unless
  # the workspace plan has room for it.
  NX_NO_CLOUD: 'true'
  # Pinning: third-party actions are pinned to reviewed commit SHAs
  # (see each `uses:` below for the resolved SHA).

jobs:
  quality:
    # Self-hosted runner when the repository variable is set (issue #276):
    # zero billed minutes and the Nx cache persists on disk between runs.
    # Unset the variable to fall back to GitHub-hosted immediately.
    #   gh variable set CI_RUNNER --body '["self-hosted","linux","x64"]'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 35
    outputs:
      e2e: ${{ steps.e2e-scope.outputs.value }}
    # Parked PRs (Dependabot by default — see .github/dependabot.yml) and drafts
    # skip the whole lane, so rebase/WIP pushes cost no runner minutes.
    # Un-park by removing the label and pushing, or mark ready for review: both
    # are `synchronize`/`ready_for_review` events that run CI on the fresh base.
    # Schedule and manual dispatch are never gated.
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'parked')) }}
    # Live Redis suites (@ndigo/redis cache + pub/sub) are env-gated and would
    # otherwise never run in CI (review DAT-F14); the URL is exported on the
    # test step below.
    services:
      redis:
        image: redis:7-alpine
        # Published on 6380, not the stock 6379: a self-hosted runner shares the
        # host's network namespace with local dev sessions, and 6379 is the
        # first port a local Redis would take (issue #283). Hosted runners are
        # isolated, so the non-default port costs nothing there.
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # `nx affected` diffs against the PR base, so the base commit has to
          # be in the graph. The repository is small; a full clone costs a few
          # seconds and buys minutes back from unaffected test projects.
          fetch-depth: 0

      - name: Detect e2e scope
        # Browser E2E only pays for itself when browser-facing code moved; the
        # weekly sweep still exercises it against the whole tree (issue #276).
        id: e2e-scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${{ github.event.pull_request.base.sha }}...${{ github.sha }}" --jq '.files[].filename')"
          changed_count="$(printf '%s\n' "$changed" | grep -c . || true)"
          # The compare API truncates at 300 files; a PR that large cannot prove
          # which paths are absent, so treat it as browser-facing.
          if [ "$changed_count" -ge 300 ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(apps/|packages/ndigo-(dom|http|ui|signals|boot|view[^/]*)/|pnpm-lock\.yaml$|nx\.json$|tsconfig)'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "no browser-facing paths changed — e2e skipped"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nx cache
        # Nx 24 resolves its task cache to `~/.nx/<workspace-id>/cache`, not
        # `.nx/cache`. Caching the old path was a permanent miss — the action
        # logged "Cache not found" and never saved, so every run rebuilt all 43
        # libraries and re-ran all 69 test projects from cold (issue #276).
        # Cache the whole per-user root: Nx keeps the cache and its SQLite
        # index together and reads a torn pair as a local hit with nothing to
        # restore.
        #
        # Restore on every run; save only from a trusted full run (schedule,
        # dispatch, main) so PR pushes do not upload a fresh multi-hundred-MB
        # entry each time and evict the pnpm store. Hosted only: the
        # self-hosted runner keeps `~/.nx` on disk between runs.
        if: vars.CI_RUNNER == ''
        id: nx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nx
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'tsconfig.build.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'tsconfig.build.json') }}-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm build

      # Fast gates first (MIN-1): the sub-minute checks below fail the lane in
      # ~1-2 minutes instead of after the heavy test + docs steps.
      - name: Root-tooling lane (node:test)
        # Durable home for the decorator-lowering plugin probes that used to
        # live in /tmp (SEC-B/WC-I): extension scope (`.cts` included),
        # workspace-vs-vendored resolution, and the `@`-pre-check.
        run: pnpm test:tooling

      - name: Example apps boot + probe (smoke)
        # Boots every Node example app on its dedicated probe port, asserts its
        # documented route (and the hello-node WebSocket echo), then requires a
        # clean SIGTERM exit — real-process rot that in-process tests miss
        # (socket bind, static files, view rendering, shutdown).
        #
        # A self-hosted runner shares the host with local dev sessions and with
        # `pnpm preflight` (which runs this same script), so its probes shift
        # to 14xxx while local runs stay on 4xxx (issue #283).
        env:
          APPS_SMOKE_PORT_OFFSET: ${{ vars.CI_RUNNER != '' && '10000' || '0' }}
        run: pnpm apps:smoke

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Internal lint rules (vitest)
        # Repository-only rules under src/oxlint run straight from TypeScript
        # (oxlint JS-plugin runtime, no build step); their specs pin both
        # namespaces and the package-surface guard.
        run: pnpm test:internal

      - name: Maintained-file formatting
        run: pnpm format:check

      - name: Docs relative-link integrity
        # Zero-dependency checker over docs/ + root markdown + package/app
        # READMEs (scripts/check-doc-links.mjs): catches renamed/moved files,
        # wrong relative paths, and dead heading anchors. No network.
        run: pnpm docs:links

      - name: Migration schema freshness (AD-78 D-6)
        # Regenerates the reference app's committed db/schema.json through
        # its own db:generate script and fails on any drift under db/
        # (scripts/check-migration-schema.mjs): entity metadata and the
        # committed migration/snapshot must stay in one commit.
        run: pnpm db:schema:check

      - name: Production dependency audit (no known vulnerabilities)
        run: pnpm audit --prod

      - name: Manifest conformance
        run: pnpm manifest:check

      - name: Agent config integrity
        # Generated agents (.opencode/agents, .omp/agents) and the shared
        # harness-neutral skills (.agents/skills) must match the committed
        # sha256 manifest. Regenerate with `pnpm agents:sync` from the
        # development-agents neutral store — never hand-edit generated dirs.
        # Repo-owned deployment files (opencode.json, .opencode/plugins/,
        # AGENTS.md) are covered by a second manifest (.agent-local.json);
        # refresh it with `node scripts/agents-check.mjs --update`.
        # Boundary: the neutral store lives outside this repo and CI never runs
        # gen.mjs, so this gate enforces self-consistency of committed content,
        # not freshness against the store.
        run: pnpm agents:check

      - name: Consumer agent content integrity
        # tools/agent-content is the authored store; the CLI assets and the
        # CNA bootstrap templates are generated. Regenerate with
        # `pnpm agent-content:build` — never hand-edit the emitted files.
        run: pnpm agent-content:check

      - name: A2UI component map integrity
        # The map is generated from registry.json; a registry item change must
        # regenerate it with `pnpm ui:a2ui-map:build`.
        run: pnpm ui:a2ui-map:check

      - name: Storybook story coverage
        # One hand-authored story file per registry item, no orphans, a stable
        # `Default` export in every file (scripts/check-stories.mjs). Generated
        # stories are retired; a new registry item without a story fails here.
        run: pnpm storybook:check

      - name: Strict type-check
        # Per-project tsc -b with the build config over every package and
        # app (`pnpm typecheck`). Scoped with --filter so out-of-tree
        # workspace members (the sibling todomvc examples) never abort the
        # lane; pnpm -r alone would TS5083 on any project without
        # tsconfig.build.json.
        run: pnpm typecheck

      - name: Unit + integration tests
        env:
          # Exercises the env-gated @ndigo/redis live suites (DAT-F14); the
          # service publishes on 6380 for host-port isolation (issue #283).
          NDIGO_REDIS_TEST_URL: redis://127.0.0.1:6380
        # PRs run only the changed projects and their dependents; the weekly
        # sweep and manual dispatch run the full set as the backstop (issue
        # #276). `dependsOn: ^build:lib` still builds every transitive
        # dependency, so a scoped run never tests against missing output.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t test --base="${{ github.event.pull_request.base.sha }}"
          else
            pnpm test
          fi

      - name: API docs (TypeDoc, zero warnings)
        # treatWarningsAsErrors is on: dead links, missing params, or
        # unresolved symbols fail the lane.
        #
        # Per-PR scoping: regenerate the packages whose `src/` or manifest
        # changed — a package's name, version and description all reach the
        # generated tree (`includeVersion`, the root API.md index), so a
        # manifest edit counts as a doc input. Full regeneration when the doc
        # toolchain changed, or when the changed-file list is truncated: the
        # compare API caps `files` at 300 entries, and a truncated list cannot
        # prove which packages are unaffected (PR #105 hit exactly that and the
        # lane silently skipped, so the freshness step below validated
        # nothing). The weekly sweep runs the full generation as the backstop.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            pnpm doc
            exit 0
          fi
          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${{ github.event.pull_request.base.sha }}...${{ github.sha }}" --jq '.files[].filename')"
          changed_count="$(printf '%s\n' "$changed" | grep -c . || true)"
          if [ "$changed_count" -ge 300 ]; then
            echo "changed-file list truncated at the API cap ($changed_count) — full regeneration"
            pnpm doc
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(scripts/|package\.json$|pnpm-workspace\.yaml$|tsconfig|\.github/)'; then
            echo "doc toolchain changed — full regeneration"
            pnpm doc
            exit 0
          fi
          packages="$(printf '%s\n' "$changed" | sed -n -e 's|^packages/\([^/]*\)/src/.*|\1|p' -e 's|^packages/\([^/]*\)/package\.json$|\1|p' | sort -u | paste -sd, -)"
          if [ -z "$packages" ]; then
            echo "no package sources or manifests changed — skipping doc generation"
            exit 0
          fi
          node scripts/doc-api.mjs --only "$packages"

      - name: API docs freshness (generated tree must match committed)
        # The step above regenerated the affected docs (or all of them on
        # schedule/dispatch); any resulting working-tree diff means committed
        # docs are stale. The weekly sweep regenerates all 46 packages, so
        # per-PR scoping cannot hide drift for long. Docs standard:
        # docs/guides/90-package-documentation.md
        run: git diff --exit-code -- packages API.md

      - name: TSDoc coverage (zero tolerance)
        # Every package must stay at zero: module summaries present, exported
        # class/interface members documented, methods carrying @param for
        # every parameter, and functions with a non-void return carrying
        # @returns. No baseline — the gate fails on any gap.
        run: pnpm doc:coverage

      - name: TSDoc examples (syntax)
        # Every fenced @example block in package source must parse as
        # TypeScript; the checker fails on any diagnostic. Docs standard:
        # docs/guides/90-package-documentation.md
        run: pnpm doc:examples

      - name: Install graft
        # The repo graph tool is a global npm package on dev machines; make it
        # available to the lanes below. Pinned: the graph format and parser
        # behavior are version-sensitive (TOL-F13).
        #
        # Weekly-only (with the two graph steps below): saves ~1.4 min on
        # every PR run; the parser/fingerprint regression gate still runs on
        # the weekly sweep and manual dispatches.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm install -g @nanonets/graft@0.29.0

      - name: Repo graph build (graft)
        # Tier-1 graph: tree-sitter wiring + symbol spans across the whole
        # tree — deterministic, no API key ($0). A hard gate: graft's parsers
        # fail loudly on constructs tsc does not cover (legacy .js scripts,
        # mixed-version decorators, unused-file syntax).
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: graft build

      - name: Repo graph in sync (graft check)
        # Immediately after a clean build the fingerprint must report the
        # graph in sync; a mismatch means the wiring or fingerprint mechanism
        # regressed. (The deep meaning tier is an environment-with-key
        # nicety — run `graft build --deep` locally after large changes.)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: graft check

      - name: Save Nx cache
        # Paired with the restore above: only a trusted full run seeds the cache
        # the rest of the week restores. `cache-primary-key` is the key the
        # restore step resolved, so restore and save never disagree.
        if: vars.CI_RUNNER == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nx
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  e2e:
    # Hosted by default: the browser lane needs system packages installed as
    # root (`playwright install --with-deps`), which a self-hosted runner
    # cannot do without passwordless sudo. Opt in with
    #   gh variable set CI_RUNNER_E2E --body '["self-hosted","linux","x64"]'
    # after provisioning the deps (see ~/bin/ci-runner-install.sh).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_E2E || '["ubuntu-latest"]') }}
    # 20 was too tight once the Storybook build and its 190-check render gate
    # joined the lane; the extra ten minutes cover a cold browser cache.
    timeout-minutes: 30
    needs: [quality]
    # Skipped when no browser-facing path changed (issue #276); the weekly
    # sweep always sets the output true, so the lane is still covered there.
    if: needs.quality.outputs.e2e == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nx cache
        # Same per-user root as the quality job — see the note there. Hosted
        # only; a self-hosted e2e runner keeps `~/.nx` on disk.
        if: vars.CI_RUNNER_E2E == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nx
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'tsconfig.build.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'tsconfig.build.json') }}-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        # The todo app resolves @ndigo/* through package `exports` -> `lib/`,
        # and `**/lib/` is gitignored: a fresh runner has no built workspace
        # libraries, so the app build below would fail to resolve every
        # @ndigo/* import without this step (review CI-B1).
        run: pnpm build

      - name: Build the todo app
        # vite preview (started by Playwright) serves dist/, which is
        # gitignored — the app must be built before the E2E run.
        run: pnpm --filter @ndigo/todo-web build

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt and needs root: correct on the hosted
        # image, wrong on a self-hosted runner (the install script provisions
        # the browser dependencies once instead).
        run: pnpm --filter @ndigo/todo-web exec playwright install ${{ vars.CI_RUNNER_E2E == '' && '--with-deps ' || '' }}chromium

      - name: E2E
        run: pnpm test:e2e

      - name: E2E (island reference integration)
        # The AD-71 reference integration: DSD first paint -> hydration -> FACE
        # form submit -> SSE. The browsers installed above are shared through
        # the Playwright cache, so this lane adds no install cost.
        run: pnpm --filter @ndigo/island test:e2e

      - name: Build Storybook
        # The hand-authored story suite for every registry item. The build
        # proves the bundle compiles with the docs pages enabled.
        run: pnpm build:storybook

      - name: Storybook render + accessibility gate
        # Renders every built story in Chromium in both themes and fails on
        # blank stories, page errors, and serious or critical axe violations.
        # The browser installed above is reused from the Playwright cache.
        run: pnpm --filter @ndigo/ui-storybook test:storybook

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: |
            apps/03-ndigo-todo-web/playwright-report
            apps/07-ndigo-island/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: |
            apps/03-ndigo-todo-web/test-results
            apps/07-ndigo-island/test-results
          if-no-files-found: ignore
