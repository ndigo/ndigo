packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'
  - 'benchmarks'
  - '../todomvc/examples/svelte'
  - '../todomvc/examples/vue'
  - '../todomvc/examples/react'
  - '../todomvc/examples/javascript-es6'

# Shared external dependency versions (HG-4). Workspace manifests reference
# these as `"catalog:"`; bump one entry and every consumer follows at the next
# install. The OpenTelemetry SDK families (0.222.0 experimental + 2.11.0
# stable) are cataloged together so their release trains cannot drift apart.
#
# Deliberately not cataloged: `peerDependencies` (published host contracts —
# ws, swagger-ui-dist, @toon-format/toon stay explicit in the peer section);
# single-use tooling (typedoc, oxfmt, jsdom, msw, ...); and the
# ../todomvc/examples/* members, which keep their own ecosystem pins
# (typescript 5.9.3/6.0.3, webpack 5.x, jsdom 20/29) as standalone demos.
catalog:
  '@nx/devkit': '~24.0.4'
  # OpenFeature bridge (@ndigo/flags-openfeature): the app-installed provider
  # runtime. `~` pin — the SDKs are 1.x, but provider-facing behavior still
  # moves on minors during the spec v0.9.0 compliance sweep (AD-87).
  '@openfeature/server-sdk': '~1.23.0'
  '@openfeature/web-sdk': '~1.10.0'
  '@opentelemetry/api': '~1.10.0'
  '@opentelemetry/api-logs': '~0.223.0'
  '@opentelemetry/context-async-hooks': '~3.1.1'
  '@opentelemetry/core': '~3.1.1'
  '@opentelemetry/exporter-logs-otlp-http': '~0.301.1'
  '@opentelemetry/exporter-metrics-otlp-http': '~0.301.1'
  '@opentelemetry/exporter-trace-otlp-http': '~0.301.1'
  '@opentelemetry/instrumentation': '~0.301.1'
  '@opentelemetry/resources': '~3.1.1'
  '@opentelemetry/sdk-logs': '~3.1.1'
  '@opentelemetry/sdk-metrics': '~3.1.1'
  '@opentelemetry/sdk-node': '~0.301.1'
  '@opentelemetry/sdk-trace-base': '~2.12.0'
  '@oxlint/plugins': '^1.91.0'
  '@toon-format/toon': '4.4.0'
  '@tsmetadata/polyfill': '^1.1.3'
  '@types/node': '~24.13.5'
  '@types/ws': '^8.18.2'
  jose: '^6.2.15'
  nx: '~24.0.4'
  oxlint: '^1.91.0'
  swagger-ui-dist: '5.34.1'
  tsx: '^4.23.13'
  typescript: '~7.0.2'
  vite: '~8.3.5'
  vitest: '~5.1.0'
  ws: '^8.22.1'
  zod: '^4.6.7'

# Workspace resolution (moved from .npmrc in pnpm 10+)
linkWorkspacePackages: deep
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling

# Approved build scripts (pnpm 10+ requires explicit allowlist)
onlyBuiltDependencies:
  - esbuild
  - msw
  - nx
  - protobufjs

allowBuilds:
  # @scarf/scarf (swagger-ui-dist telemetry) — postinstall is `node ./report.js`
  # (machine fingerprinting); deliberately never executed (SEC-3, 2026-09-28).
  '@scarf/scarf': false
  esbuild: true
  msw: true
  nx: true
  protobufjs: true

# Security overrides — force patched versions of vulnerable transitive
# dependencies (axios CRLF/DoS, follow-redirects credential leakage,
# minimatch DoS, brace-expansion DoS, form-data CRLF, js-yaml DoS, nanoid,
# nx, postcss, protobufjs, tmp, react-router, smol-toml).
overrides:
  axios: '>=1.18.0'
  minimatch: '>=11.0.1' # globparts amplification DoS (2026-10-31) — supersedes the ReDoS pin
  'typedoc>minimatch': '10.2.6' # TypeDoc 0.28 calls the pre-v11 `matchOne` API during entry-point glob expansion; its copy stays on 10.x (dev-only subtree, outside the --prod audit)
  brace-expansion: '>=5.0.12' # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr — DoS via brace expansion (nx chain)
  form-data: '>=4.0.6'
  follow-redirects: '>=1.16.2' # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c / cross-realm array discard — credential leakage via redirects (nx > axios chain)
  '@grpc/grpc-js': '>=1.14.5' # GHSA-m9gg-hp2v-232j / GHSA-f596-whhp-79r4 — auth-context bypass, error leakage (otel grpc exporter chain)
  js-yaml: '>=3.15.1'
  nanoid: '>=3.3.18'
  nx: '>=24.0.4' # GHSA-hrvq-x7jp-36xv — path traversal in `nx migrate` package-migrations extraction (@nx/devkit chain)
  postcss: '>=8.5.23'
  protobufjs: '>=7.6.5'
  tmp: '>=0.2.7'
  react-router: '>=7.18.2'
  smol-toml: '>=1.8.1' # GHSA-r4xh-jqrq-34v2 — quadratic-time parse() key rescan (nx · @nx/devkit chain)
  source-map-js: '>=1.2.2' # GHSA-68fv-2mgg-jv7q — ReDoS in source-map parsing (sibling todomvc Vue build chain)
  '@a2ui/web_core>zod': '>=4.6.6' # GHSA-mrhx-c7xc-m3w5 — web_core pins zod ^3; the workspace v4 line is API-compatible on the surface path
  'zod-to-json-schema>zod': '>=4.6.6' # same advisory — the schema helper must not carry the vulnerable copy

# pnpm 12's built-in `minimumReleaseAge` (1440 min) quarantines packages
# published in the last day. The default is non-strict, so an install that
# needs a younger version proceeds and records a version-pinned exception
# below. Prune keeps this list from growing stale across bumps.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nx/devkit@24.0.4'
  - '@nx/nx-darwin-arm64@24.0.4'
  - '@nx/nx-darwin-x64@24.0.4'
  - '@nx/nx-freebsd-x64@24.0.4'
  - '@nx/nx-linux-arm-gnueabihf@24.0.4'
  - '@nx/nx-linux-arm64-gnu@24.0.4'
  - '@nx/nx-linux-arm64-musl@24.0.4'
  - '@nx/nx-linux-x64-gnu@24.0.4'
  - '@nx/nx-linux-x64-musl@24.0.4'
  - '@nx/nx-win32-arm64-msvc@24.0.4'
  - '@nx/nx-win32-x64-msvc@24.0.4'
  - nx@24.0.4
