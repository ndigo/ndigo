packages:
  - 'packages/*'
  - 'apps/*'
  - '../todomvc/examples/bluejs'
  - '../todomvc/examples/svelte'
  - '../todomvc/examples/vue'
  - '../todomvc/examples/react'
  - '../todomvc/examples/javascript-es6'

# Workspace resolution (moved from .npmrc in pnpm 10+)
linkWorkspacePackages: deep
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling

# Approved build scripts (pnpm 10+ requires explicit allowlist)
onlyBuiltDependencies:
  - esbuild
  - msw
  - nx
  - protobufjs

allowBuilds:
  esbuild: true
  msw: true
  nx: true
  protobufjs: true

# Security overrides — force patched versions of vulnerable transitive
# dependencies (axios CRLF/DoS, minimatch ReDoS, brace-expansion DoS,
# form-data CRLF, js-yaml DoS, nanoid, postcss, protobufjs, tmp, react-router).
overrides:
  axios: '>=1.18.0'
  minimatch: '>=9.0.7'
  brace-expansion: '>=5.0.9'
  form-data: '>=4.0.6'
  js-yaml: '>=3.15.1'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  protobufjs: '>=7.6.5'
  tmp: '>=0.2.7'
  react-router: '>=7.18.2'
  smol-toml: '>=1.7.1' # GHSA-7w5x-hrqm-74c2 — DoS via malformed TOML (nx · @nx/devkit chain)
