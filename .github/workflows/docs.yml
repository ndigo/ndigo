name: Docs

# Light lane for docs-only PRs: the main CI workflow skips them via
# paths-ignore, and this one keeps formatting and relative links honest at a
# fraction of the cost (MIN-1 / #41).
on:
  pull_request:
    branches: [master, main]
    # Runs on open/promote only. Every job bills at least one minute and bills
    # whole even when the link check fails in five seconds, so the light lane is
    # re-run when the PR is promoted rather than on every push; `pnpm preflight`
    # covers edits in between (issue #276).
    types: [opened, reopened, ready_for_review]
    paths:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Minimal permissions: only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  docs:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        # oxfmt and the docs scripts run from the workspace's own toolchain.
        run: pnpm install --frozen-lockfile

      - name: Maintained-file formatting
        run: pnpm format:check

      - name: Docs relative-link integrity
        run: pnpm docs:links

      - name: Guide contract
        # Every published guide: numbered title, audience/prerequisites/
        # reference block, "What you'll learn", "See also", index coverage,
        # existing reference paths, and parseable TypeScript fences.
        run: pnpm guides:check
