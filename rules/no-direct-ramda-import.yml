id: no-direct-ramda-import
language: TypeScript
severity: warning
message: Import from '@blue/util' instead of 'ramda'. See AGENTS.md §4.7.
rule:
  kind: import_statement
  has:
    field: source
    regex: ^['\"]ramda['\"]$
files:
  - packages/**/*.ts
  - apps/**/*.ts
ignores:
  - packages/blue-util/**
  - '**/*.spec.ts'
  - '**/*.test.ts'
