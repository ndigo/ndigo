packages:
  - 'packages/*'
  - 'apps/*'
  - '../todomvc/examples/bluejs'
  - '../todomvc/examples/svelte'
  - '../todomvc/examples/vue'
  - '../todomvc/examples/react'
  - '../todomvc/examples/javascript-es6'



# Workspace resolution (moved from .npmrc in pnpm 10+)
linkWorkspacePackages: deep
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling

# Approved build scripts (pnpm 10+ requires explicit allowlist)
onlyBuiltDependencies:
  - '@ast-grep/cli'
  - esbuild
  - msw
  - nx
  - protobufjs

allowBuilds:
  '@ast-grep/cli': true
  cypress: set this to true or false
  esbuild: true
  msw: true
  nx: true
  protobufjs: true
