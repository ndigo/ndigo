name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Minimal permissions: only read the repository; artifacts need contents read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Pinning: third-party actions are pinned to reviewed commit SHAs
  # (see each `uses:` below for the resolved SHA).

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm build

      - name: Unit + integration tests
        run: pnpm test

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Maintained-file formatting
        run: pnpm format:check

      - name: Docs relative-link integrity
        # Zero-dependency checker over docs/ + root markdown + package/app
        # READMEs (scripts/check-doc-links.mjs): catches renamed/moved files,
        # wrong relative paths, and dead heading anchors. No network.
        run: pnpm docs:links

      - name: Production dependency audit (no known vulnerabilities)
        run: pnpm audit --prod

      - name: Manifest conformance
        run: pnpm manifest:check

      - name: Agent config integrity
        # Generated agents/skills (.opencode/, .claude/, .omp/) must match the
        # committed sha256 manifest. Regenerate with `pnpm agents:sync` from
        # the development-agents neutral store — never hand-edit generated dirs.
        # Repo-owned deployment files (opencode.json, .opencode/plugins/,
        # AGENTS.md) are covered by a second manifest (.agent-local.json);
        # refresh it with `node scripts/agents-check.mjs --update`.
        # Boundary: the neutral store lives outside this repo and CI never runs
        # gen.mjs, so this gate enforces self-consistency of committed content,
        # not freshness against the store.
        run: pnpm agents:check

      - name: Strict type-check
        # Per-project tsc -b with the build config over every package and
        # app (`pnpm typecheck`). Scoped with --filter so out-of-tree
        # workspace members (the sibling todomvc examples) never abort the
        # lane; pnpm -r alone would TS5083 on any project without
        # tsconfig.build.json.
        run: pnpm typecheck

      - name: API docs (TypeDoc, zero warnings)
        # treatWarningsAsErrors is on: dead links, missing params, or
        # unresolved symbols fail the lane.
        run: pnpm doc

      - name: API docs freshness (generated tree must match committed)
        # pnpm doc regenerated everything above; any resulting working-tree
        # diff means committed docs are stale. Docs standard:
        # docs/guides/12-package-documentation.md
        run: git diff --exit-code -- packages doc

      - name: Install graft
        # The repo graph tool is a global npm package on dev machines; make it
        # available to the lanes below.
        run: npm install -g @nanonets/graft

      - name: Repo graph build (graft)
        # Tier-1 graph: tree-sitter wiring + symbol spans across the whole
        # tree — deterministic, no API key ($0). A hard gate: graft's parsers
        # fail loudly on constructs tsc does not cover (legacy .js scripts,
        # mixed-version decorators, unused-file syntax).
        run: graft build

      - name: Repo graph in sync (graft check)
        # Immediately after a clean build the fingerprint must report the
        # graph in sync; a mismatch means the wiring or fingerprint mechanism
        # regressed. (The deep meaning tier is an environment-with-key
        # nicety — run `graft build --deep` locally after large changes.)
        run: graft check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        # The todo app resolves @blue/* through package `exports` -> `lib/`,
        # and `**/lib/` is gitignored: a fresh runner has no built workspace
        # libraries, so the app build below would fail to resolve every
        # @blue/* import without this step (review CI-B1).
        run: pnpm build

      - name: Build the todo app
        # vite preview (started by Playwright) serves dist/, which is
        # gitignored — the app must be built before the E2E run.
        run: pnpm --filter @blue/todo build

      - name: Install Playwright browsers
        run: pnpm --filter @blue/todo exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: apps/blue-todo/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: apps/blue-todo/test-results
          if-no-files-found: ignore
