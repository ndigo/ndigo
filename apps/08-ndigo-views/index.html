<!doctype html>
<html lang="en" data-framework="ndigo">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ndigo • View Resolution</title>
        <style>
            :root {
                color-scheme: light;
                font-family: system-ui, sans-serif;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                grid-template-columns: 16rem 1fr;
                grid-template-rows: 1fr auto;
                grid-template-areas:
                    'sidebar app'
                    'sidebar footer';
                gap: 1rem;
                padding: 1rem;
                box-sizing: border-box;
                background: #f8fafc;
                color: #0f172a;
            }

            #app,
            #sidebar,
            #site-footer {
                padding: 2rem;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                background: #ffffff;
            }

            #app {
                grid-area: app;
            }

            #sidebar {
                grid-area: sidebar;
            }

            #site-footer {
                grid-area: footer;
            }

            /* Regions are only visible once a targeter places output in them. */
            #sidebar:empty,
            #site-footer:empty {
                display: none;
            }

            nav a {
                margin-right: 0.75rem;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <aside id="sidebar"></aside>
        <footer id="site-footer"></footer>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
