name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Minimal permissions: only read the repository; artifacts need contents read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Pinning: third-party actions are pinned to reviewed commit SHAs
  # (see each `uses:` below for the resolved SHA).

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm build

      - name: Unit + integration tests
        run: pnpm test

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Maintained-file formatting
        run: pnpm format:check

      - name: Production dependency audit (no known vulnerabilities)
        run: pnpm audit --prod

      - name: Manifest conformance
        run: pnpm manifest:check

      - name: Strict type-check
        # Per-package tsc -b with the build config — the same gate the
        # `build:lib` scripts run; a clean workspace build implies this,
        # kept as an explicit loud lane for failure isolation.
        run: pnpm -r exec tsc -b tsconfig.build.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the todo app
        # vite preview (started by Playwright) serves dist/, which is
        # gitignored — the app must be built before the E2E run.
        run: pnpm --filter @blue/todo build

      - name: Install Playwright browsers
        run: pnpm --filter @blue/todo exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: apps/blue-todo/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: apps/blue-todo/test-results
          if-no-files-found: ignore
