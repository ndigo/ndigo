id: no-direct-arcsecond-import
language: TypeScript
severity: warning
message: Import from '@blue/parser' instead of 'arcsecond'. See AGENTS.md §4.7.
rule:
  kind: import_statement
  has:
    field: source
    regex: ^['\"]arcsecond['\"]$
files:
  - packages/**/*.ts
  - apps/**/*.ts
ignores:
  - packages/blue-parser/**
  - '**/*.spec.ts'
  - '**/*.test.ts'
