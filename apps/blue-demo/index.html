<!doctype html>
<html lang="en" data-framework="bluejs">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>BlueJS • TodoMVC</title>
        <link rel="stylesheet" href="node_modules/todomvc-common/base.css" />
        <link rel="stylesheet" href="node_modules/todomvc-app-css/index.css" />
        <style>
            /* ── Auth navigation styles ─────────────────────────────────────────── */
            .auth-nav {
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 8px 16px;
                background: #f5f5f5;
                border-bottom: 1px solid #ddd;
            }
            .auth-nav a {
                text-decoration: none;
                color: #333;
                font-size: 14px;
            }
            .auth-nav a:hover {
                text-decoration: underline;
            }
            .auth-nav .auth-label {
                color: #666;
                font-size: 13px;
            }
            .auth-nav .auth-name {
                font-weight: bold;
                color: #333;
            }
            .auth-nav button {
                background: #e74c3c;
                color: white;
                border: none;
                padding: 4px 12px;
                border-radius: 3px;
                cursor: pointer;
                font-size: 13px;
            }
            .auth-nav button:hover {
                background: #c0392b;
            }
            /* ── Auth page styles ───────────────────────────────────────────────── */
            .login-container,
            .profile-container,
            .admin-container,
            .forbidden-container {
                max-width: 480px;
                margin: 40px auto;
                padding: 24px;
                background: #fff;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
            .login-container .form-group {
                margin-bottom: 12px;
            }
            .login-container label {
                display: block;
                margin-bottom: 4px;
                font-weight: bold;
            }
            .login-container input {
                width: 100%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 3px;
                box-sizing: border-box;
            }
            .login-container button[type="submit"] {
                background: #3498db;
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 3px;
                cursor: pointer;
                margin-top: 8px;
            }
            .login-container .demo-notice {
                margin-top: 12px;
                font-size: 13px;
                color: #666;
            }
            .login-container .error {
                color: #e74c3c;
                margin-bottom: 8px;
            }
            .profile-info p {
                margin: 4px 0;
            }
            .forbidden-container .error,
            .admin-container .error {
                color: #e74c3c;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <!-- Auth navigation (populated by JS) -->
        <div id="auth-nav" class="auth-nav"></div>

        <footer class="info">
            <p>Double-click to edit a todo</p>
            <p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
            <p style="margin-top: 8px;">
                <a href="#/auth/login">Login</a> ·
                <a href="#/auth/profile">Profile</a> ·
                <a href="#/auth/admin">Admin</a> ·
                <a href="#/auth/forbidden">Forbidden</a>
            </p>
        </footer>

        <script charset="utf-8" type="text/javascript" src="node_modules/todomvc-common/base.js"></script>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
