id: mixed-case-acronym
language: TypeScript
severity: warning
message: Class/interface '$NAME' uses mixed-case acronym. Use all-uppercase (e.g., HTTPTransformer, JSONParser).
rule:
  any:
    - kind: class_declaration
      pattern: class $NAME { $$$BODY }
      constraints:
        NAME:
          regex: .*(Http|Json|Xml|Url|Api|Html|Dto|Uuid|Uri).*
    - kind: interface_declaration
      pattern: interface $NAME { $$$BODY }
      constraints:
        NAME:
          regex: .*(Http|Json|Xml|Url|Api|Html|Dto|Uuid|Uri).*
files:
  - packages/**/src/**/*.ts
  - apps/**/src/**/*.ts
