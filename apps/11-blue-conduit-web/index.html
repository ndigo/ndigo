<!doctype html>
<html lang="en" data-framework="bluejs">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>BlueJS • Conduit</title>
        <style>
            :root {
                --ink: #222;
                --muted: #7c8b96;
                --brand: #5cb85c;
                --brand-dark: #449d44;
                --line: #e2e6ea;
                --danger: #b85c5c;
                --bg: #f6f7f9;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    16px/1.5 ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
            }
            a {
                color: var(--brand-dark);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            #app {
                max-width: 960px;
                margin: 0 auto;
                padding: 0 16px 48px;
            }
            .nav {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 12px 0;
                border-bottom: 1px solid var(--line);
                margin-bottom: 20px;
            }
            .nav .brand {
                font-weight: 700;
                font-size: 20px;
                color: var(--brand);
            }
            .spacer {
                flex: 1;
            }
            .nav a.active {
                font-weight: 600;
            }
            .nav-links {
                display: flex;
                gap: 14px;
            }
            .nav .sign-out {
                border: 1px solid var(--line);
                background: #fff;
                border-radius: 4px;
                padding: 4px 10px;
                cursor: pointer;
                color: var(--muted);
                font-size: 14px;
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 260px;
                gap: 28px;
                align-items: start;
            }
            @media (max-width: 760px) {
                .layout {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
            .page-title {
                font-size: 24px;
                margin: 0 0 16px;
            }
            .feed-toggle,
            .tabs {
                display: flex;
                gap: 8px;
                list-style: none;
                padding: 0;
                margin: 0 0 16px;
                border-bottom: 1px solid var(--line);
            }
            .feed-toggle button,
            .tabs button,
            .tabs a.tab-link {
                display: inline-block;
                background: none;
                border: none;
                border-bottom: 2px solid transparent;
                padding: 8px 4px;
                cursor: pointer;
                color: var(--muted);
                font-size: 15px;
                text-decoration: none;
            }
            .feed-toggle button.selected,
            .tabs button.selected,
            .tabs a.tab-link.selected {
                color: var(--brand-dark);
                border-bottom-color: var(--brand);
                font-weight: 600;
            }
            .article-preview {
                border-bottom: 1px solid var(--line);
                padding: 16px 0;
            }
            .article-meta {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 13px;
                color: var(--muted);
            }
            .article-meta .author {
                color: var(--brand-dark);
                font-weight: 600;
            }
            .avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--line);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                color: var(--muted);
                overflow: hidden;
            }
            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .article-preview h2 {
                font-size: 20px;
                margin: 10px 0 6px;
            }
            .article-preview p {
                color: var(--muted);
                margin: 0 0 10px;
            }
            .article-preview footer {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .tag-list {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .tag-list button {
                background: #eef3f6;
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 2px 10px;
                font-size: 12px;
                color: var(--muted);
                cursor: pointer;
            }
            .tag-list button.selected {
                background: var(--brand);
                border-color: var(--brand);
                color: #fff;
            }
            .tag-list button.static {
                cursor: default;
            }
            .sidebar {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 12px;
            }
            .sidebar h3 {
                margin: 0 0 10px;
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--muted);
            }
            button.favorite {
                background: none;
                border: 1px solid var(--brand);
                color: var(--brand-dark);
                border-radius: 4px;
                padding: 3px 10px;
                cursor: pointer;
                font-size: 13px;
            }
            button.favorite.on {
                background: var(--brand);
                color: #fff;
            }
            button.follow {
                background: var(--brand);
                border: 1px solid var(--brand);
                color: #fff;
                border-radius: 4px;
                padding: 3px 10px;
                cursor: pointer;
                font-size: 13px;
            }
            button.follow.on {
                background: #fff;
                color: var(--muted);
                border-color: var(--muted);
            }
            button.primary {
                background: var(--brand);
                border: 1px solid var(--brand);
                color: #fff;
                border-radius: 4px;
                padding: 8px 18px;
                cursor: pointer;
                font-size: 15px;
            }
            button.primary:hover {
                background: var(--brand-dark);
            }
            button.danger {
                background: #fff;
                border: 1px solid var(--danger);
                color: var(--danger);
                border-radius: 4px;
                padding: 8px 18px;
                cursor: pointer;
            }
            form .field {
                margin-bottom: 14px;
            }
            form label {
                display: block;
                font-size: 13px;
                color: var(--muted);
                margin-bottom: 4px;
            }
            form input,
            form textarea {
                width: 100%;
                padding: 8px 10px;
                border: 1px solid var(--line);
                border-radius: 4px;
                font: inherit;
                background: #fff;
            }
            form textarea {
                min-height: 160px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 14px;
            }
            .field-error,
            .form-error {
                color: var(--danger);
                font-size: 13px;
                margin: 4px 0 0;
            }
            .form-error {
                margin-bottom: 12px;
            }
            .errors {
                list-style: none;
                padding: 0;
                margin: 0 0 12px;
                color: var(--danger);
            }
            .pagination {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                list-style: none;
                padding: 0;
                margin: 20px 0 0;
            }
            .pagination button {
                border: 1px solid var(--line);
                background: #fff;
                border-radius: 4px;
                min-width: 34px;
                padding: 5px 8px;
                cursor: pointer;
                color: var(--muted);
            }
            .pagination button.selected {
                background: var(--brand);
                border-color: var(--brand);
                color: #fff;
            }
            .article-body {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 20px;
                margin: 16px 0;
            }
            .article-body h1,
            .article-body h2,
            .article-body h3 {
                margin-top: 1.2em;
            }
            .article-body pre {
                background: #f2f4f6;
                padding: 12px;
                border-radius: 4px;
                overflow-x: auto;
            }
            .article-body code {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 14px;
            }
            .comments-title {
                font-size: 18px;
                margin: 28px 0 12px;
            }
            .comment-list {
                list-style: none;
                padding: 0;
                margin: 0 0 20px;
            }
            .comment {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 12px;
                margin-bottom: 12px;
            }
            .comment p {
                margin: 8px 0 0;
                white-space: pre-wrap;
            }
            .comment-header {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 13px;
                color: var(--muted);
            }
            .comment-header .grow {
                flex: 1;
            }
            .comment-header button {
                border: none;
                background: none;
                color: var(--muted);
                cursor: pointer;
                font-size: 12px;
            }
            .muted {
                color: var(--muted);
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 20px;
                max-width: 560px;
                margin: 0 auto;
            }
            .card.wide {
                max-width: none;
            }
            .card-actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 8px;
            }
            .profile-header {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 20px;
                margin-bottom: 20px;
                text-align: center;
            }
            .profile-header h1 {
                margin: 8px 0 4px;
                font-size: 22px;
            }
            .profile-header p {
                color: var(--muted);
                margin: 0 0 12px;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
